name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec security scan
        run: $(go env GOPATH)/bin/gosec -quiet -exclude-generated -exclude=G104,G204,G304,G115,G703 -confidence medium ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...

      # The code mode spike (#325) and its JavaScript runtime (goja) are
      # only compiled with -tags codemode.
      - name: Run govulncheck (-tags codemode)
        run: $(go env GOPATH)/bin/govulncheck -tags codemode ./...

  # Requires "Dependency graph" to be enabled in the repository settings
  # (Settings -> Code security -> Dependency graph). Until the maintainer
  # enables it, the action fails with "Dependency review is not supported",
  # so the job is opt-in: set the repository variable
  # ENABLE_DEPENDENCY_REVIEW=true once the dependency graph is on.
  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4