name: Homebrew Formula Update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., v0.5.2)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download release checksums.txt
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          checksums_url="https://github.com/mmornati/leanproxy-mcp/releases/download/v${VERSION}/checksums.txt"

          for i in $(seq 1 30); do
            if curl -fsL "$checksums_url" -o /tmp/checksums.txt; then
              echo "checksums.txt downloaded (attempt ${i})"
              break
            fi
            echo "checksums.txt not yet available (attempt ${i}/30), retrying in 15s..."
            sleep 15
          done

          if [ ! -s /tmp/checksums.txt ]; then
            echo "::error::checksums.txt not available for v${VERSION} after 30 attempts (~7.5 min). Is the release finished?"
            exit 1
          fi

          get_sha() { grep "leanproxy-mcp_${VERSION}_${1}_${2}.tar.gz" /tmp/checksums.txt | awk '{print $1}'; }

          echo "darwin_amd64=$(get_sha darwin amd64)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(get_sha darwin arm64)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(get_sha linux amd64)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(get_sha linux arm64)" >> $GITHUB_OUTPUT

          if [ -z "$(get_sha darwin amd64)" ] || [ -z "$(get_sha darwin arm64)" ] || \
             [ -z "$(get_sha linux amd64)" ] || [ -z "$(get_sha linux arm64)" ]; then
            echo "::error::One or more checksums missing from checksums.txt"
            exit 1
          fi

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.sha256.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.sha256.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha256.outputs.linux_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sha256.outputs.linux_arm64 }}
        run: |
          cat > Formula/leanproxy-mcp.rb << EOF
          class LeanproxyMcp < Formula
            desc "LeanProxy-MCP - A lightweight token firewall for MCP servers"
            homepage "https://github.com/mmornati/leanproxy-mcp"
            license "MIT"

            version "$VERSION"

            on_macos do
              on_arm do
                url "https://github.com/mmornati/leanproxy-mcp/releases/download/v${VERSION}/leanproxy-mcp_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/mmornati/leanproxy-mcp/releases/download/v${VERSION}/leanproxy-mcp_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/mmornati/leanproxy-mcp/releases/download/v${VERSION}/leanproxy-mcp_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/mmornati/leanproxy-mcp/releases/download/v${VERSION}/leanproxy-mcp_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "leanproxy-mcp"
            end

            test do
              system "#{bin}/leanproxy-mcp", "version"
            end
          end
          EOF
          echo "Formula updated successfully"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          commit-message: "chore(homebrew): update formula to v${{ steps.version.outputs.version }}"
          title: "chore(homebrew): update formula to v${{ steps.version.outputs.version }}"
          body: |
            ## Summary

            This PR updates the Homebrew formula to version **${{ steps.version.outputs.version }}**.

            ### Changes

            - Updated SHA256 checksums for all platform binaries:
              - darwin/amd64
              - darwin/arm64
              - linux/amd64
              - linux/arm64

            ### Verification

            The formula is now ready for Homebrew installation:
            ```bash
            brew tap mmornati/leanproxy-mcp https://github.com/mmornati/leanproxy-mcp
            brew install leanproxy-mcp
            ```

            Created by GitHub Actions - [Homebrew Formula Update](https://github.com/mmornati/leanproxy-mcp/actions/workflows/homebrew-formula-update.yml)
          branch: homebrew-formula-update-v${{ steps.version.outputs.version }}
          delete-branch: true
          token: ${{ secrets.GITHUB_TOKEN }}