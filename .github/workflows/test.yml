name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          go test -v -race -timeout 5m -coverprofile=coverage.out ./... 2>&1 | tee test-output.log

      # The code mode spike (#325) is only compiled with -tags codemode:
      # its sandbox and limit tests do not run in the step above.
      - name: Run code mode spike tests (-tags codemode)
        run: make test-codemode

      # The verbose log is tens of thousands of lines; repeat just the failures
      # at the end so they are visible without scrolling the whole job log.
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          echo "::group::Failed tests and packages"
          grep -nE -B2 -A40 -e '^--- FAIL' -e '^FAIL' -e '^panic:' -e 'WARNING: DATA RACE' -e '\[(build|setup) failed\]' test-output.log | head -n 1500 || true
          echo "::endgroup::"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # End-to-end benchmark + conformance harness (#301): builds the real
  # binary, drives `server run --stdio` against the 118-tool catalog mock and
  # fails on any broken assertion (redaction, burst errors, parallel wall
  # time, 5 MB relay, p95 overhead). Behind the `harness` build tag, so the
  # `test` job above never runs it.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run harness
        run: make harness

      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-results
          path: bench-results/harness.md
          if-no-files-found: warn
