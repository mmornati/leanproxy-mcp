name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attests that the release artifacts in dist/ were built by this
      # workflow run, so consumers can verify provenance via `gh attestation
      # verify`. Does not require any maintainer-configured secrets: it uses
      # the workflow's own OIDC token (id-token: write, above).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*.tar.gz,dist/checksums.txt"