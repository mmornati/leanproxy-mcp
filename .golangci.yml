# golangci-lint v2 configuration.
#
# Per-file linter exclusions below are pre-existing lint debt tracked under
# Epic #288 (v0.10, "Make the README true"). Per issue #302's rule, this
# config migration only removed exclusions that were trivial to fix outright
# (see cmd/completion.go and cmd/migrate.go, fixed in #302). All remaining
# exclusions stay in place and must be removed by whichever Epic 19 story
# next touches that file, as that story's own PR fixes the underlying lint
# finding (unhandled errors, unused code, gosec findings, etc.) rather than
# carrying the suppression forward. See issue #288 and its sub-issues for
# the story-by-story breakdown; no new exclusions were added by this change.
version: "2"
linters:
  enable:
    - gosec
    - misspell
    - prealloc
  settings:
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - ineffassign
          - staticcheck
        path: _test\.go
      - linters:
          - unused
        path: cmd/root\.go
      - linters:
          - unused
        path: cmd/compactor_test\.go
      - linters:
          - staticcheck
        path: cmd/report\.go
      - linters:
          - errcheck
          - unused
        path: pkg/migrate/vscode\.go
      - linters:
          - errcheck
        path: pkg/pool/pool\.go
      - linters:
          - errcheck
          - staticcheck
          - unused
        path: pkg/pool/server\.go
      - linters:
          - ineffassign
          - unused
        path: pkg/bouncer/redactor\.go
      - linters:
          - unused
        path: pkg/bouncer/streaming\.go
      - linters:
          - unused
        path: pkg/compactor/cache\.go
      - linters:
          - unused
        path: pkg/migrate/scanner\.go
      - linters:
          - unused
        path: pkg/pool/health\.go
      - linters:
          - unused
        path: pkg/pool/pool\.go
      - linters:
          - unused
        path: pkg/pool/queue\.go
      - linters:
          - unused
        path: pkg/concurrent/circuit\.go
      - linters:
          - unused
        path: pkg/concurrent/ratelimit\.go
      - linters:
          - errcheck
        path: pkg/registry/cache\.go
      - linters:
          - gosec
        path: pkg/bouncer/allowlist\.go
      - linters:
          - gosec
        path: pkg/bouncer/safe_pattern\.go
      - linters:
          - gosec
        path: pkg/bouncer/boilerplate\.go
      - linters:
          - gosec
        path: pkg/utils/
      - linters:
          - gosec
        path: pkg/concurrent/circuit\.go
      - linters:
          - gosec
        path: pkg/registry/lifecycle\.go
      - linters:
          - prealloc
        path: pkg/statusfile/file\.go
      - linters:
          - gosec
        path: pkg/pool/server\.go
      - linters:
          - prealloc
        path: pkg/migrate/
      - linters:
          - prealloc
        path: pkg/mcp/handlers_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
