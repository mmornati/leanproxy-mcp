# MkDocs configuration for LeanProxy-MCP documentation

site_name: LeanProxy-MCP
site_description: "The local token firewall for MCP: cuts the tokens tool schemas and results cost, and redacts, screens and pins every call. One Go binary; nothing leaves your machine."
site_author: "Marco Mornati"
site_url: https://mmornati.github.io/leanproxy-mcp

# Repository settings
repo_name: mmornati/leanproxy-mcp
repo_url: https://github.com/mmornati/leanproxy-mcp
edit_uri: https://github.com/mmornati/leanproxy-mcp/edit/main/docs/

# Copyright
copyright: "Copyright &copy; 2026 Marco Mornati"

# Theme
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: xray
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: xray-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

# Navigation
nav:
  - Home: index.md
  - Get started:
      - Why LeanProxy: why-leanproxy.md
      - Installation: installation.md
      - Quick Start: quickstart.md
  - Guides:
      - Configuration: configuration.md
      - Security: security.md
      - Savings Report: savings-report.md
      - Web Dashboard (serve): dashboard.md
      - Observability (OpenTelemetry): observability.md
      - IDE Extensions: extensions.md
      - First-party Servers: servers.md
      - Graceful Shutdown: shutdown.md
  - Reference:
      - Commands: commands.md
      - Architecture: architecture.md
      - Benchmark Results: benchmark-results.md
      - Code Mode (spike): design/code-mode.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md

not_in_nav: |
  audit/*

# Extensions
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - md_in_html
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Plugins
plugins:
  - search:
      separator: '[\s\-\.]+'

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mmornati/leanproxy-mcp

extra_css:
  - stylesheets/extra.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/home.js